name: Validate incident data

on:
  pull_request:
    paths:
      - "src/data/**"
      - "scripts/validate-data.mjs"
  push:
    branches: [master]
    paths:
      - "src/data/**"
      - "scripts/validate-data.mjs"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-data.mjs
